name: CI

on:
  push:
  pull_request:

jobs:
  lint-test-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .

      - name: Unit and integration tests (simulator, Modbus TCP, detection, assistant guards, API)
        run: python -m pytest -q

      - name: Evaluations, no-model path (detection on 3 held-out seeds, dosing, assistant retrieval)
        run: |
          plant-ai eval detection --quick
          plant-ai eval dosing
          plant-ai eval assistant
